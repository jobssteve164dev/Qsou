name: qsou

services:
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      API_RELOAD: "false"
      ENABLE_DERIVED_SEARCH: "false"
      ENABLE_DERIVED_PROCESSING: "false"
      QSOU_DATA_ROOT: /var/lib/qsou
      QSOU_SOURCE_REGISTRY: /app/config/sources.json
      CORS_ORIGINS: '${QSOU_CORS_ORIGINS:-["http://localhost:3000"]}'
      SECRET_KEY: ${QSOU_SECRET_KEY:?QSOU_SECRET_KEY is required}
      QSOU_ADMIN_USERNAME: ${QSOU_ADMIN_USERNAME:?QSOU_ADMIN_USERNAME is required}
      QSOU_ADMIN_PASSWORD: ${QSOU_ADMIN_PASSWORD:?QSOU_ADMIN_PASSWORD is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${QSOU_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    expose:
      - "8000"
    volumes:
      - qsou-data:/var/lib/qsou
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${QSOU_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  collector:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/crawler.Dockerfile
    environment:
      QSOU_STANDALONE_CRAWLER: "true"
      QSOU_OUTBOX_DISPATCH_ENABLED: "false"
      QSOU_DATA_ROOT: /var/lib/qsou
      QSOU_SOURCE_REGISTRY: /app/config/sources.json
      LOG_FILE: /app/crawler/logs/scrapy.log
      QSOU_SOURCE_IDS: ${QSOU_SOURCE_IDS:-}
      QSOU_CRAWL_POLL_SECONDS: ${QSOU_CRAWL_POLL_SECONDS:-60}
      QSOU_ADAPTER_MAX_DETAILS: ${QSOU_ADAPTER_MAX_DETAILS:-12}
    volumes:
      - qsou-data:/var/lib/qsou
      - qsou-crawler-logs:/app/crawler/logs
    restart: unless-stopped

volumes:
  qsou-data:
  qsou-crawler-logs:
