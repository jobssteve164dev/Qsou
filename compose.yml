name: qsou

services:
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      API_RELOAD: "false"
      ENABLE_ELASTICSEARCH: "true"
      ENABLE_QDRANT: "false"
      ENABLE_DERIVED_PROCESSING: "false"
      QSOU_DATA_ROOT: /var/lib/qsou
      QSOU_SOURCE_REGISTRY: /app/config/sources.json
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_INDEX_PREFIX: qsou_
      QSOU_OBJECT_STORAGE_BACKEND: ${QSOU_OBJECT_STORAGE_BACKEND:-file}
      QSOU_OBJECT_STORAGE_ENDPOINT: ${QSOU_OBJECT_STORAGE_ENDPOINT:-}
      QSOU_OBJECT_STORAGE_REGION: ${QSOU_OBJECT_STORAGE_REGION:-us-east-1}
      QSOU_OBJECT_STORAGE_BUCKET: ${QSOU_OBJECT_STORAGE_BUCKET:-}
      QSOU_OBJECT_BACKUP_BUCKET: ${QSOU_OBJECT_BACKUP_BUCKET:-}
      QSOU_OBJECT_STORAGE_ACCESS_KEY: ${QSOU_OBJECT_STORAGE_ACCESS_KEY:-}
      QSOU_OBJECT_STORAGE_SECRET_KEY: ${QSOU_OBJECT_STORAGE_SECRET_KEY:-}
      CORS_ORIGINS: '${QSOU_CORS_ORIGINS:-["http://localhost:3000"]}'
      SECRET_KEY: ${QSOU_SECRET_KEY:?QSOU_SECRET_KEY is required}
      QSOU_ADMIN_USERNAME: ${QSOU_ADMIN_USERNAME:?QSOU_ADMIN_USERNAME is required}
      QSOU_ADMIN_PASSWORD: ${QSOU_ADMIN_PASSWORD:?QSOU_ADMIN_PASSWORD is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${QSOU_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    expose:
      - "8000"
    volumes:
      - qsou-data:/var/lib/qsou
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${QSOU_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  collector:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/crawler.Dockerfile
    environment:
      QSOU_STANDALONE_CRAWLER: "true"
      QSOU_OUTBOX_DISPATCH_ENABLED: "false"
      QSOU_DATA_ROOT: /var/lib/qsou
      QSOU_SOURCE_REGISTRY: /app/config/sources.json
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      QSOU_OBJECT_STORAGE_BACKEND: ${QSOU_OBJECT_STORAGE_BACKEND:-file}
      QSOU_OBJECT_STORAGE_ENDPOINT: ${QSOU_OBJECT_STORAGE_ENDPOINT:-}
      QSOU_OBJECT_STORAGE_REGION: ${QSOU_OBJECT_STORAGE_REGION:-us-east-1}
      QSOU_OBJECT_STORAGE_BUCKET: ${QSOU_OBJECT_STORAGE_BUCKET:-}
      QSOU_OBJECT_BACKUP_BUCKET: ${QSOU_OBJECT_BACKUP_BUCKET:-}
      QSOU_OBJECT_STORAGE_ACCESS_KEY: ${QSOU_OBJECT_STORAGE_ACCESS_KEY:-}
      QSOU_OBJECT_STORAGE_SECRET_KEY: ${QSOU_OBJECT_STORAGE_SECRET_KEY:-}
      LOG_FILE: /app/crawler/logs/scrapy.log
      QSOU_SOURCE_IDS: ${QSOU_SOURCE_IDS:-}
      QSOU_CRAWL_POLL_SECONDS: ${QSOU_CRAWL_POLL_SECONDS:-60}
      QSOU_ADAPTER_MAX_DETAILS: ${QSOU_ADAPTER_MAX_DETAILS:-12}
    volumes:
      - qsou-data:/var/lib/qsou
      - qsou-crawler-logs:/app/crawler/logs
    restart: unless-stopped

  indexer:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["python", "-m", "qsou_data.indexer"]
    environment:
      QSOU_DATA_ROOT: /var/lib/qsou
      QSOU_SOURCE_REGISTRY: /app/config/sources.json
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      QSOU_OBJECT_STORAGE_BACKEND: ${QSOU_OBJECT_STORAGE_BACKEND:-file}
      QSOU_OBJECT_STORAGE_ENDPOINT: ${QSOU_OBJECT_STORAGE_ENDPOINT:-}
      QSOU_OBJECT_STORAGE_REGION: ${QSOU_OBJECT_STORAGE_REGION:-us-east-1}
      QSOU_OBJECT_STORAGE_BUCKET: ${QSOU_OBJECT_STORAGE_BUCKET:-}
      QSOU_OBJECT_BACKUP_BUCKET: ${QSOU_OBJECT_BACKUP_BUCKET:-}
      QSOU_OBJECT_STORAGE_ACCESS_KEY: ${QSOU_OBJECT_STORAGE_ACCESS_KEY:-}
      QSOU_OBJECT_STORAGE_SECRET_KEY: ${QSOU_OBJECT_STORAGE_SECRET_KEY:-}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_ALIAS: qsou_documents
      QSOU_INDEXER_POLL_SECONDS: "5"
      QSOU_INDEXER_RECONCILE_SECONDS: "3600"
      QSOU_INDEXER_BATCH_SIZE: "100"
      QSOU_INDEXER_MAX_HEALTH_AGE_SECONDS: "60"
    volumes:
      - qsou-data:/var/lib/qsou
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch:
    platform: linux/amd64
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    expose:
      - "9200"
    volumes:
      - qsou-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  qsou-data:
  qsou-crawler-logs:
  qsou-elasticsearch-data:
