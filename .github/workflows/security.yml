name: Security

on:
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "web-frontend/package.json"
      - "web-frontend/package-lock.json"
      - ".github/workflows/security.yml"
      - "scripts/audit_python_dependencies.py"
      - "tests/test_python_audit.py"
  push:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - "web-frontend/package.json"
      - "web-frontend/package-lock.json"
      - ".github/workflows/security.yml"
      - "scripts/audit_python_dependencies.py"
      - "tests/test_python_audit.py"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit production dependency graphs
        run: |
          python scripts/audit_python_dependencies.py deploy/requirements-api.txt
          python scripts/audit_python_dependencies.py deploy/requirements-crawler.txt
          python scripts/audit_python_dependencies.py deploy/requirements-indexer.txt
      - name: Audit legacy dependency graphs
        run: |
          python scripts/audit_python_dependencies.py requirements.txt
          python scripts/audit_python_dependencies.py api-gateway/requirements.txt
          python scripts/audit_python_dependencies.py data-processor/requirements.txt
          python scripts/audit_python_dependencies.py crawler/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
