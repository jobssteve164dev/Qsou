name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qsou_test
          POSTGRES_USER: qsou
          POSTGRES_PASSWORD: qsou-test-password
        options: >-
          --health-cmd "pg_isready -U qsou -d qsou_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://qsou:qsou-test-password@127.0.0.1:5432/qsou_test
      QSOU_TEST_DATABASE_URL: postgresql://qsou:qsou-test-password@127.0.0.1:5432/qsou_test
      QSOU_TEST_DATABASE_RESET: confirmed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            deploy/requirements-api.txt
            deploy/requirements-crawler.txt
      - run: python -m pip install -r deploy/requirements-api.txt -r deploy/requirements-crawler.txt pytest==9.1.1 PyYAML==6.0.3
      - run: python -m alembic upgrade head
      - run: python -m pytest tests -q
      - name: Render the production Compose contract
        env:
          DATABASE_URL: postgresql://qsou:placeholder@database/qsou
          QSOU_SECRET_KEY: compose-contract-placeholder
          QSOU_ADMIN_USERNAME: compose-contract
          QSOU_ADMIN_PASSWORD: compose-contract-placeholder
        run: |
          docker compose config --format json > /tmp/qsou-compose.json
          jq -e '
            (.services | keys | sort) == ["api", "collector", "elasticsearch", "indexer", "web"]
            and all(.services[]; .platform == "linux/amd64")
            and all(.services[]; .build != null and .restart == "unless-stopped")
          ' /tmp/qsou-compose.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: npm ci
      - run: npm run test:security
      - run: npm run lint
      - run: npm run build

  collector-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the final collector image and patched parser
        run: |
          docker build --platform linux/amd64 -f deploy/crawler.Dockerfile -t qsou-collector-security .
          docker image inspect qsou-collector-security | jq -e '
            .[0].Config.Cmd == ["python", "/app/crawler/run_schedule.py"]
            and ((.[0].Config.Entrypoint // []) | length) == 0
          '
          docker run --rm --entrypoint python qsou-collector-security -c '
          import importlib.metadata
          from twisted.mail.imap4 import wildcardToRegexp
          from scrapy.crawler import CrawlerProcess
          import qsou_crawler.settings
          assert importlib.metadata.version("Twisted") == "26.4.0.post0"
          assert wildcardToRegexp("(a+)+z", "/").match("aaaaaaaaaaaaaaaz") is None
          assert wildcardToRegexp("mail/%", "/").fullmatch("mail/team")
          assert not wildcardToRegexp("mail/%", "/").fullmatch("mail/team/2026")
          assert importlib.metadata.version("pypdf") == "6.21.1"
          print("collector image: patched Twisted, pypdf, Scrapy imports and process command verified")
          '
      - name: Verify the packaged Elasticsearch image preserves the approved upstream
        run: |
          upstream=docker.elastic.co/elasticsearch/elasticsearch:8.11.0@sha256:b0effe89b1ac5a73e116ccdc897e807d3546ea06afb93d8873a7c707d3016186
          docker pull --platform linux/amd64 "$upstream"
          docker build --platform linux/amd64 -f deploy/elasticsearch.Dockerfile -t qsou-elasticsearch-release .
          docker image inspect qsou-elasticsearch-release "$upstream" | jq -e '
            .[0].Architecture == "amd64"
            and .[0].Os == "linux"
            and .[0].Config == .[1].Config
            and .[0].RootFS == .[1].RootFS
          '

  web-image-cross-architecture:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64
      - name: Build and exercise the final amd64 web image
        run: |
          docker build --platform linux/amd64 -f deploy/web.Dockerfile -t qsou-web-cross-architecture .
          test "$(docker image inspect qsou-web-cross-architecture --format '{{.Architecture}}')" = "amd64"
          docker run --name qsou-web-sharp-check --entrypoint node qsou-web-cross-architecture \
            -e "require('sharp'); console.log(process.arch)"
          docker run -d --name qsou-web-http-check -p 3000:3000 qsou-web-cross-architecture
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health \
              | jq -e '.service == "qsou-web" and .status == "ok"' >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 2
          done
          docker exec qsou-web-http-check sh -eu -c '
            test -d /app/node_modules/@img/sharp-linux-x64
            test -d /app/node_modules/@img/sharp-libvips-linux-x64
            test ! -d /app/node_modules/@img/sharp-linux-arm64
            test ! -d /app/node_modules/@img/sharp-libvips-linux-arm64
          '
